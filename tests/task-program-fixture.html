<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Mitch Workflow Fixture</title>
<style>body{padding:28px;background:#f6f4ef;color:#263124;font:18px 'Segoe UI',sans-serif}input,button{font:18px 'Segoe UI',sans-serif;padding:13px;border:1px solid #829576;border-radius:7px;background:white;margin:10px 0;display:block}input{width:330px}h1{font-size:23px}</style></head>
<body><h1 id="heading"></h1><p>Disposable test controls. No accounts, files or network actions.</p><main id="stage"></main><script>
(()=>{const stage=document.getElementById('stage');let role='source';const field=(name,value)=>{const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='text';input.setAttribute('aria-label',name);input.value=value;stage.append(label,input);return input;};const button=(name,handler)=>{const element=document.createElement('button');element.textContent=name;element.setAttribute('aria-label',name);element.onclick=handler;stage.append(element);};const show=()=>{window.fixtureState.actions.push('show');stage.replaceChildren();field('Source value',window.fixtureState.sourceValue);};window.resetFixture=(newRole,already=false,value='Fixture data 478')=>{role=newRole;document.title=role==='source'?'Mitch Workflow Source Fixture':'Mitch Workflow Destination Fixture';document.getElementById('heading').textContent=document.title;window.fixtureState={role,actions:[],sourceValue:value,output:''};stage.replaceChildren();if(role==='source'){if(already){show();window.fixtureState.actions=[];}else button('Show record',show);}else{const input=field('Destination value','');button('Apply locally',()=>{window.fixtureState.actions.push('apply');window.fixtureState.output=input.value;stage.replaceChildren();button('Applied '+input.value,()=>window.fixtureState.actions.push('indicator'));});}return true;};window.resetFixture('source');})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Mitch Speed Fixture</title><style>body{font:18px 'Segoe UI';padding:28px;background:#f7f6f1;color:#263124}button,input{display:block;font:inherit;padding:12px;margin:12px 0}h1{font-size:24px}</style></head><body><h1 id="heading">Home</h1><main id="stage"></main><script>
const stage=document.getElementById('stage'),heading=document.getElementById('heading');
function button(name,action){const e=document.createElement('button');e.textContent=name;e.onclick=()=>{window.fixtureState.clicks.push(name);action();};stage.append(e);}
function editor(){heading.textContent='Settings';stage.replaceChildren();const e=document.createElement('input');e.setAttribute('aria-label','Name');e.value='';e.oninput=()=>window.fixtureState.value=e.value;stage.append(e);button('Apply',()=>{window.fixtureState.saved=e.value;heading.textContent='Saved';stage.replaceChildren();const p=document.createElement('p');p.textContent=e.value;stage.append(p);button('Saved',()=>{});});}
window.resetFixture=(mode,extra=false)=>{window.fixtureState={mode,clicks:[],saved:null,value:''};stage.replaceChildren();heading.textContent='Home';if(mode==='field')editor();else button('Settings',()=>{if(mode==='complex'){heading.textContent='Continue editing';stage.replaceChildren();button('Continue editing',editor);}else editor();});document.getElementById('extra')?.remove();if(extra){const p=document.createElement('button');p.id='extra';p.textContent='Unrelated information added after learning';document.body.prepend(p);}return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>resolve(true))));};window.resetFixture('field');
</script></body></html>
